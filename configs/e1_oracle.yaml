# E1 upper bound: the oracle with perfect information (docs/oracle_baseline.md).
# Same scenarios, noise levels, episodes and seeds as e1_baselines.yaml, and the
# same name, so its rows go into results/e1_baselines.csv next to the other
# methods (the runner appends and skips rows already there). The oracle ignores
# the noise, so its results are the same at every noise level: it is run once
# (noise "none") and those numbers are the upper bound at every level. Cost:
# about 5 s per intersection, 1 min per merge and 10 min per dense episode on
# one core, so these 600 episodes take roughly 4-5 h with 8 workers.
name: e1_baselines
episodes: 200
seed_offset: 1000   # fresh evaluation seeds 1000+ (seeds 0-199 were used while developing; docs/paper_notes.md)
noise_levels: [none]
scenarios:
  - label: intersection
    scenario: intersection
    env: {}
  - label: intersection_dense
    scenario: intersection
    env: {controlled_vehicles: 8, initial_vehicle_count: 14}
  - label: merge
    scenario: merge
    env: {}
arbiters:
  - {label: Oracle, kind: oracle}
