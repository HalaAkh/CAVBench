# E1, MCTS baseline, STRICT version: safety-critical multi-agent MCTS (Lin et al.,
# T-ITS 2025) with exactly Table I and our earlier choices, no calibration (kind
# "mcts", see docs/mcts_baseline.md). The main baseline is the calibrated one in
# e1_mcts.yaml; this config runs the strict version next to it (label "MCTS-strict").
# Same scenarios, noise levels and seeds as
# e1_baselines.yaml, and the same results file (name: e1_baselines), so the
# rows sit next to the other methods.
#
# This run is slow (about 1000 tree iterations per conflict group every 0.2 s,
# in Python). Check the time first with configs/mcts_smoke.yaml, then:
#     python experiments/run_experiment.py configs/e1_mcts_strict.yaml --workers 8
# Finished episodes are kept, so an interrupted run resumes where it stopped.
name: e1_baselines
episodes: 200
seed_offset: 1000   # fresh evaluation seeds 1000+ (seeds 0-199 were used while developing; docs/paper_notes.md)
noise_levels: [none, low, medium, high]
scenarios:
  - label: intersection
    scenario: intersection
    env: {}
  - label: intersection_dense
    scenario: intersection
    env: {controlled_vehicles: 8, initial_vehicle_count: 14}
  - label: merge
    scenario: merge
    env: {}
arbiters:
  - {label: MCTS-strict, kind: mcts}
