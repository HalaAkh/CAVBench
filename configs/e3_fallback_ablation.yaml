# E3 (H3): with vs without the fallback (rejected maneuvers are executed cautiously).
name: e3_fallback_ablation
episodes: 200
seed_offset: 0
noise_levels: [none, low, medium, high]
scenarios:
  - label: intersection
    scenario: intersection
    env: {}
  - label: intersection_dense
    scenario: intersection
    env: {controlled_vehicles: 8, initial_vehicle_count: 14}
  - label: merge
    scenario: merge
    env: {}
arbiters:
  - {label: UCRA, kind: whatif_fuzzy}
  - {label: UCRA-noFallback, kind: whatif_fuzzy, params: {use_fallback: false}}
