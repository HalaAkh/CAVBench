# E1 (H1): the proposed method against the baselines at four noise levels.
# 200 matched seeds per condition (power analysis: p1 = 0.90, p2 = 0.97,
# alpha = 0.05, power 0.8 -> about 194).
name: e1_baselines
episodes: 200
seed_offset: 0
noise_levels: [none, low, medium, high]
scenarios:
  - label: intersection
    scenario: intersection
    env: {}
  - label: intersection_dense
    scenario: intersection
    env: {controlled_vehicles: 8, initial_vehicle_count: 14}
  - label: merge
    scenario: merge
    env: {}
arbiters:
  - {label: UCRA, kind: whatif_fuzzy}
  - {label: FCFS, kind: fcfs}
  - {label: NoCoord, kind: no_coordination}
# The LLM baseline is in e1_llm.yaml (it needs an OpenAI API key). It writes to
# the same results file, results/e1_baselines.csv, so the notebook compares all
# four methods on the same seeds.
